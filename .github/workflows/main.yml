name: Build and publish release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    if: >
      ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.5+8.0.LTS'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Android accept licenses
        uses: SimonMarquis/android-accept-licenses@v1

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
