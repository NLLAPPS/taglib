name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    if: >
      ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Android accept licenses
        uses: SimonMarquis/android-accept-licenses@v1

      - name: Build Android library AAR
        run: ./gradlew clean bundleReleaseAar

      - name: Create GitHub release on main push
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --generate-notes \
            --title "Release ${{ github.run_number }}" \
            ./build/outputs/aar/taglib-release.aar
